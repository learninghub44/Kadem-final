services:
  - type: web
    name: kadem-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYHERO_API_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_USERNAME
        sync: false
      - key: PAYHERO_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REFERRAL_REGISTRATION_BONUS
        value: "50"
      - key: REFERRAL_ACTIVATION_BONUS
        value: "100"
      - key: REFERRAL_PACKAGE_BONUS
        value: "150"
    healthCheckPath: /health
